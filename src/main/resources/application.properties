spring.application.name=divinasbackend
server.port=8080

# Busca el .env en la carpeta actual y, si IntelliJ se abrió desde la carpeta padre, en ./divinasbackend
spring.config.import=optional:file:.env[.properties],optional:file:./divinasbackend/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/divinasdb
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true