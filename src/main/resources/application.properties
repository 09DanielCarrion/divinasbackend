spring.application.name=divinasbackend
server.port=8080

spring.config.import=optional:file:.env[.properties],optional:file:./divinasbackend/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/divinasdb
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=120

app.sistema.usuario=${SISTEMA_USUARIO:}
app.sistema.password=${SISTEMA_PASSWORD:}
